
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login or Sign Up</title>

    <!-- Luxury Curvy Font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #d7ecff, #f9f9f2); /* cream + soft blue */
            font-family: 'Playfair Display', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: #ffffff;
            width: 360px;
            padding: 45px;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
            text-align: center;
            border: 1px solid #e3eaf5;
        }

        h2 {
            margin-bottom: 25px;
            font-size: 30px;
            color: #2c3e50;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 14px 0;
            font-size: 18px;
            font-family: 'Playfair Display', serif;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            background: #5ca4ff; /* Soft luxury blue */
            transition: 0.3s;
        }

        .btn:hover {
            background: #3b8df5;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Welcome</h2>

        <a href="login.html" class="btn">Login</a>
        <a href="signup.html" class="btn">Sign Up</a>
    </div>
</body>
</html>
