<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login or Sign Up</title>

    <style>
        body {
            margin: 0;
            background: #f2f2f2;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: white;
            width: 350px;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            text-align: center;
        }
        h2 {
            margin-bottom: 25px;
            font-size: 26px;
            color: #333;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            font-size: 16px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            background: #0067c0;
        }
        .btn:hover {
            background: #0059a3;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Welcome</h2>

        <!-- BOTH BUTTONS SHOW THE CODE -->
        <a href="/showcode" class="btn">Login</a>
        <a href="/showcode" class="btn">Sign Up</a>
    </div>

</body>
</html>
