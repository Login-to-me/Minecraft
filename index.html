
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login or Sign Up</title>

    <style>
        body {
            margin: 0;
            background: #f2f2f2;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            width: 350px;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            text-align: center;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            margin-bottom: 25px;
            font-size: 26px;
            color: #333;
            font-weight: 600;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            font-size: 16px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            background: #0067c0;
            transition: 0.25s;
        }

        .btn:hover {
            background: #0059a3;
        }

        .btn2 {
            background: #444;
        }

        .btn2:hover {
            background: #333;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Welcome</h2>

        <!-- LOGIN BUTTON -->
        <a href="/login" class="btn">Login</a>

        <!-- SIGN UP BUTTON -->
        <a href="/signup" class="btn btn2">Sign Up</a>
    </div>

</body>
</html>
