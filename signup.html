
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <style>
        body {
            margin: 0;
            background: #f2f2f2;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: white;
            width: 350px;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            text-align: center;
        }
        h2 {
            margin-bottom: 25px;
            font-size: 26px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            display: block;
            border: none;
            font-size: 16px;
            color: white;
            border-radius: 5px;
            background: #0067c0;
            cursor: pointer;
        }
        .btn:hover {
            background: #0059a3;
        }
        a {
            display: block;
            margin-top: 15px;
            color: #0067c0;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Create an Account</h2>

        <form action="#">
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email Address" required>
            <input type="password" placeholder="Password" required>
            <input type="password" placeholder="Confirm Password" required>
            <button class="btn">Sign Up</button>
        </form>

        <a href="login.html">Already have an account? Login</a>
    </div>
</body>
</html>
